<div class="container">
  <h3>{{ courseDetails?.title }}</h3>
  <ul>
        <ng-container>
        <h3>{{ courseDetails?.modules[currentPage].title }}</h3>
        <div *ngFor="let lesson of courseDetails?.modules[currentPage].lessons">
          <span class="lead">{{ lesson.title }}</span><br>
          <iframe width="420" height="315"
          src='https://www.youtube.com/embed/tNO9SWEjoIU'>
          </iframe>
          <ul>
            <a href='{{m.url}}' *ngFor="let m of lesson.media"> {{ m.filename }} <br></a>
          </ul>
        </div>
        </ng-container>
  </ul>
  <nav aria-label="...">
    <ul class="pagination">
      <!-- <li class="page-item" (click)="decrementModulePage()">
        <span class="page-link">Previous</span>
      </li> -->
      <li class="page-item" *ngFor="let module of courseDetails?.modules; let i = index"><a class="page-link" (click)="setModulePage(i)" style="cursor: pointer;">{{ i }}</a>
      </li>
      <!-- <li class="page-item active">
        <span class="page-link">
          2
          <span class="sr-only">(current)</span>
        </span>
      </li>
      <li class="page-item"><a class="page-link" href="#">3</a></li> -->
      <!-- <li class="page-item">
        <a class="page-link" [ngClass]="{'disabled': currentPage === courseDetails?.modules.length}" (click)="incrementModulePage()">Next</a>
      </li> -->
    </ul>
  </nav>
</div>
