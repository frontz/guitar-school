<div class="container">
  <div class="d-flex justify-content-center" *ngIf="coursesList.length === 0">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <div class="row">
    <div class="col-sm-4" *ngFor="let course of coursesList">
      <div class="card">
        <img *ngIf="course?.image?.url === null" class="card-img-top"
          src="https://www.couplandleather.co.uk/cdn/shop/products/WhatsAppImage2022-01-14at14.46.57_3_1600x1066.jpg?v=1642188207"
          alt="Course image">
          <img *ngIf="course?.image?.url !== null" class="card-img-top"
          src="{{ course?.image?.url }}"
          alt="Course image">
        <div class="card-body">
          <h5 class="card-title">{{ course.title }}</h5>
          <p class="font-italic">
            <i style="float: left;"> {{ course.author.first_name }} {{ course.author.last_name }}</i>
            <img src="assets/img/face.jpg" style="width: 40px; float: right;"></p><br>
          <p>Level: {{ course.level }}</p>
          <p class="card-text">{{ course.desc }} <br>
            <span *ngIf="idsUserCoursesList.includes(course.id)" class="text-success">Zakupiłeś ten kurs</span>
            <a routerLink="/course/{{ course.id }}" style="text-decoration: none; bottom: 10px;" *ngIf="!idsUserCoursesList.includes(course.id)">Więcej szczegółów >></a>
          </p>
          <p class="text-danger" *ngIf="!idsUserCoursesList.includes(course.id)"> {{ course.price | currency: course.currency }}</p>  
          <p *ngIf="idsUserCoursesList.includes(course.id)">
            Możesz przejść do materiałów
          </p>   
          <a href='{{ course.payment_link}}' *ngIf="course?.active === true">
            <button class="btn btn-primary" *ngIf="!idsUserCoursesList.includes(course.id)">Kup kurs</button>
          </a>
          <a *ngIf="course?.active === true">
            <button class="btn btn-primary" routerLink="/my-course/{{ course.id }}" *ngIf="idsUserCoursesList.includes(course.id)">Idź do kursu</button>
          </a>
          <button class="btn btn-primary" disabled *ngIf="course?.active !== true">   
            Dostępny wkrótce  
          </button>         
        </div>
      </div>
    </div>
  </div>
</div>
